name: Weekly Cross-Browser Tests

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.browser }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      CONFIGURATION: Release
      BROWSER: ${{ matrix.browser }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration ${{ env.CONFIGURATION }}

      - name: Install Playwright browser
        run: pwsh bin/${{ env.CONFIGURATION }}/net10.0/playwright.ps1 install ${{ matrix.browser }}

      - name: Run all tests
        run: >-
          dotnet test --no-build --settings Playwright.runsettings
          --results-directory TestResults --verbosity normal
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: TestResults
          if-no-files-found: warn
