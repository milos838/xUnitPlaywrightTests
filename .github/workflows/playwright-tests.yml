name: Playwright Tests

permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: windows-latest
    env:
      CONFIGURATION: Release
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration ${{ env.CONFIGURATION }}

      - name: Install Playwright browsers
        # use the same configuration folder as build
        run: pwsh bin/${{ env.CONFIGURATION }}/net10.0/playwright.ps1 install

      - name: Run tests
        # write a single known location for the TRX file
        run: dotnet test --no-build --settings Playwright.runsettings --verbosity normal --logger "trx;LogFileName=TestResults/test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/test-results.trx

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Publish test results
        if: always() && (github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository)
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        with:
          files: 'TestResults/test-results.trx'
          check_name: Playwright Test Results
